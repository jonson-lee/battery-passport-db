5" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">其他通用事件也可能以电池单元为目标。</text><text x="1140" y="1016.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">本页只展示维护子类；全局互斥或重叠尚待确认。</text><text x="1140" y="1043.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">其他新增对象暂不自动加入这一继承结构。</text><text x="65" y="1013.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">父事件通用事实：时间、目标、参与方和数据来源。</text><text x="65" y="1040.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">组级目标支持及角色规则须与第一板块共同确认。</text><text x="65" y="1067.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">电池组所有权沿用共享资产登记的定义；</text><text x="65" y="1094.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">本视图暂不规定所有权的数量关系。</text></svg>