="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><text x="65" y="185.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">建议：每条记录有一个主要责任组织。</text><text x="65" y="212.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">其他协作参与方暂不在这三条联系中展开。</text><rect x="715.0" y="784.0" width="270" height="72" fill="#f2f3f5" stroke="#57748d" stroke-width="1.8" stroke-dasharray="8 5" /><text x="850.0" y="815.3199999999999" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">生命周期事件</text><text x="850.0" y="837.28" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">LifecycleEvent</text><polygon points="300.0,776.0 410.0,820.0 300.0,864.0 190.0,820.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="300.0" y="826.3" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">参与事件</text><polyline points="300,436 300,776" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="270.0" y="701.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="300.0" y="720.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><polyline points="410,820 715,820" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="605.0" y="806.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="635.0" y="825.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><ellipse cx="300.0" cy="950.0" rx="110.0" ry="