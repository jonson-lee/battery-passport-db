65.0,444.0 449.0,400.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="565.0" y="395.32" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">由组装作业</text><text x="565.0" y="417.28000000000003" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">移出</text><polyline points="355,300 449,400" fill="none" stroke="#57748d" stroke-width="1.8" /><polyline points="681,400 817.5,456" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="373.0" y="318.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="403.0" y="337.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..1</text><rect x="715.0" y="396.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="745.0" y="415.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><polygon points="565.0,516.0 681.0,560.0 565.0,604.0 449.0,560.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="565.0" y="555.3199999999999" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">由维护</text><text x="565.0" y="577.28" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">加入</text><polyline points="355,670 449,560" fill="none" stroke="#57748d" stroke-width="1.8" /><polyline points="681,560 817.5,484" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="373.0" y="583.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="403.0" y="602.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..1</text><rect x="715.0" y="490.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="745.0" y="509.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><polygon points="565.0,656.0 681.0,700.0 565.0,744.0 449.0,700.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="565.0" y="695.3199999999999" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">由维护</text><text x="565.0" y="717.28" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">移出</text><polyline points="355,670 449,700" fill="none" stroke="#57748d" stroke-width="1.8" /><polyline points="681,700 817.5,509" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="373.0" y="653.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="403.0" y="672.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..1</text><rect x="715.0" y="573.0" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="745.0" y="592.1" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><text x="65" y="185.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">对每次成员安装，每一条来源联系单独允许零或一个执行来源。</text><text x="65" y="790.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">加入来源：组装作业与维护二选一；移出来源也分别二选一。</text><text x="65" y="817.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">来源已知时恰有一个主要来源；历史来源缺失时，必须记录缺失理由。</text><text x="65" y="844.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">尚未移出的安装不设移出来源；执行来源和成员安装必须属于同一组。</text><polyline points="1160,175 1160,865" fill="none" stroke="#cbd5de" stroke-width="1.8" /><rect x="1210.0" y="254.0" width="220" height="72" fill="#eaf2f8" stroke="#57748d" stroke-width="1.8" /><text x="1320.0" y="285.32" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">实际组装作业</text><text x="1320.0" y="307.28000000000003" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">AssemblyJob</text><rect x="1505.0" y="254.0" width="230" height="72" fill="#eaf2f8" stroke="#57748d" stroke-width="1.8" /><text x="1620.0" y="285.32" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">实际维护事件</text><text x="1620.0" y="307.28000000000003" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">MaintenanceEvent</text><rect x="1345.0" y="614.0" width="250" height="72" fill="#eaf2f8" stroke="#57748d" stroke-width="1.8" /><text x="1470.0" y="645.3199999999999" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">组级检查</text><text x="1470.0" y="667.28" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">PackInspection</text><polygon points="1320.0,406.0 1415.0,450.0 1320.0,494.0 1225.0,450.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="1320.0" y="456.3" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">触发检查</text><polyline points="1320,326 1320,406" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="1335.0" y="352.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="1365.0" y="371.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..1</text><polyline points="1320,494 1405,614" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="1255.0" y="536.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="1285.0" y="555.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><polygon points="1620.0,406.0 1715.0,450.0 1620.0,494.0 1525.0,450.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="1620.0" y="456.3" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">触发检查</text><polyline points="1620,326 1620,406" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="1635.0" y="352.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="1665.0" y="371.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..1</text><polyline points="1620,494 1535,614" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="1625.0" y="536.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="1655.0" y="555.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><text x="1205" y="725.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">对一次检查，两类执行来源合计</text><text x="1205" y="752.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">最多一个主要触发来源。</text><text x="1205" y="779.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">定期检查可以没有执行触发来源。</text><text x="1205" y="806.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">初装检查或维护后检查应记录</text><text x="1205" y="833.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">其主要触发作业或维护。</text><text x="1205" y="860.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">触发执行与检查必须属于同一组。</text><polyline points="55,895 1745,895" fill="none" stroke="#cbd5de" stroke-width="1.8" /><rect x="125.0" y="974.0" width="250" height="72" fill="#eaf2f8" stroke="#57748d" stroke-width="1.8" /><text x="250.0" y="1005.3199999999999" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">实际组装作业</text><text x="250.0" y="1027.28" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">AssemblyJob</text><rect x="885.0" y="974.0" width="270" height="72" fill="#eaf2f8" stroke="#57748d" stroke-width="1.8" /><text x="1020.0" y="1005.3199999999999" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">实际维护事件</text><text x="1020.0" y="1027.28" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">MaintenanceEvent</text><polygon points="635.0,966.0 760.0,1010.0 635.0,1054.0 510.0,1010.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="635.0" y="1016.3" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">属于维护</text><polyline points="375,1010 510,1010" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="405.0" y="996.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="435.0" y="1015.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><polyline points="760,1010 885,1010" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="790.0" y="996.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="820.0" y="1015.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..1</text><text x="1205" y="958.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">若重组 J2 执行这次成员变化，</text><text x="1205" y="985.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">则直接归于 J2，再追溯到其所属维护 M1。</text><text x="1205" y="1012.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">同一变化不再直接归于 M1，避免重复登记。</text></svg>