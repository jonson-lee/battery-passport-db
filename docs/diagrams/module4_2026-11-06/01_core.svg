iddle">1..1</text><polygon points="560.0,436.0 660.0,480.0 560.0,524.0 460.0,480.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="560.0" y="486.3" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">经历组装</text><polyline points="405,590 435,590 435,480 460,480" fill="none" stroke="#57748d" stroke-width="1.8" /><polyline points="660,480 725,480" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="405.0" y="498.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="435.0" y="517.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">1..1</text><rect x="663.0" y="466.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="693.0" y="485.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><polygon points="560.0,656.0 660.0,700.0 560.0,744.0 460.0,700.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="560.0" y="706.3" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">经历维护</text><polyline points="405,590 435,590 435,700 460,700" fill="none" stroke="#57748d" stroke-width="1.8" /><polyline points="660,700 725,700" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="405.0" y="654.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="435.0" y="673.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">1..1</text><rect x="663.0" y="686.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="693.0" y="705.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><polygon points="1090.0,546.0 1190.0,590.0 1090.0,634.0 990.0,590.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="1090.0" y="596.3" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">接受检查</text><polyline points="405,590 990,590" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="455.0" y="576.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="485.0" y="595.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">1..1</text><polyline points="1190,590 1305,590" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="1220.0" y="576.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="1250.0" y="595.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><polygon points="560.0,806.0 660.0,850.0 560.0,894.0 460.0,850.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="560.0" y="856.3" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">对应使用决定</text><polyline points="280,626 280,850 460,850" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="250.0" y="784.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="280.0" y="803.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">1..1</text><polyline points="660,850 1305,850" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="1215.0" y="836.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="1245.0" y="855.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><polygon points="1430.0,676.0 1530.0,720.0 1430.0,764.0 1330.0,720.0" fill="#ffffff" stroke="#57748d" stroke-width="1.8" /><text x="1430.0" y="726.3" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle">引用检查证据</text><polyline points="1430,626 1430,676" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="1470.0" y="637.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="1500.0" y="656.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><polyline points="1430,764 1430,814" fill="none" stroke="#57748d" stroke-width="1.8" /><rect x="1470.0" y="778.5" width="60" height="27" fill="#ffffff" stroke="none" stroke-width="1.8" /><text x="1500.0" y="797.6" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" text-anchor="middle">0..N</text><text x="690" y="355.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">“成员安装”表示某单元在某组的一次安装发生。</text><text x="690" y="382.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">同组同单元可再次安装，以“安装发生序次”区分。</text><text x="700" y="930.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">维护目标从“生命周期事件”继承，详见第 4 页。</text><text x="700" y="957.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">“经历维护”仅展示继承后的目标约束，不另存一份目标。</text><text x="65" y="1005.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">基数读法：固定对端一个实例，端点标注表示此端可以对应多少个实例（沿用 LN3 课程读法）。</text><text x="65" y="1032.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">例如：一个电池组可有零到多次组装作业；每次组装作业针对且仅针对一个电池组。</text><text x="65" y="1059.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">图例：矩形＝实体；矩形内含菱形＝关联实体；菱形＝联系；灰色虚线框＝共享实体。0..N 表示零到多。</text></svg>