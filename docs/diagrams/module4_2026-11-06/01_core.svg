<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><rect width="1800" height="1200" fill="white" /><text x="55" y="47.25" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="15" text-anchor="start">G22 / 第四板块：组包与维护 / 概念设计</text><text x="55" y="92.5" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="30" text-anchor="start" font-weight="700">组包与维护：核心实体关系</text><text x="55" y="124.95" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" text-anchor="start">本板块提出六类业务对象；灰色虚线框表示其他板块的共享实体。主要属性见第 3 页。</text><polyline points="55,144 1745,144" fill="none" stroke="#cbd5de" stroke-width="1.8" /><polyline points="55,1120 1745,1120" fill="none" stroke="#cbd5de" stroke-width="1.8" /><text x="55" y="1155.25" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="15" text-anchor="start">v0.1 中文版 | 2026-11-06 | 评审初稿：实体、标识和业务规则仍待组内确认</text><text x="1745" y="1155.25" fill="#566879" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="15" text-anchor="end">第 1 页 / 核心关系</text><rect x="155.0" y="554.0" width="250" height="72" fill="#eaf2f8" stroke="#57748d" stroke-width="1.8" /><text x="280.0" y="585.3199999999999" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">电池组</text><text x="280.0" y="607.28" fill="#20354a" font-family="PingFang SC, Heiti SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">BatteryPack</text><rect x="705.0" y="217.0" width="290" height="86" fill="#eaf2f8" stroke="#57748d" stroke-width="1.8" /><polygon points="850.0,217.0 995.0,260.0 850.0,303.0 705.0,260.0" fill="#eaf2f8" stroke="#57748d" stroke-width="1.8" /><text x="850.0" y="255.32000000000002" fill="#20354a" font-family="P